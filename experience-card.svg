<svg xmlns="http://www.w3.org/2000/svg" width="800" height="100" viewBox="0 0 800 100" role="img" aria-label="Experience - click to open" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
    .chev { animation: bob 1.6s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(6px); } }
    .tw  { animation: tw 2.4s ease-in-out infinite; }
    .tw2 { animation: tw 2.4s ease-in-out 0.8s infinite; }
    .tw3 { animation: tw 2.4s ease-in-out 1.6s infinite; }
    @keyframes tw { 0%,100% { opacity: 0.2; } 50% { opacity: 1; } }
  </style>

  <rect x="2" y="2" width="796" height="96" rx="24" fill="#FFF6E6" stroke="#F5B461" stroke-width="2.5"/>

  <!-- briefcase icon -->
  <circle cx="58" cy="50" r="28" fill="#BFEDE6"/>
  <path d="M51 43v-4a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3v4" fill="none" stroke="#1F8F84" stroke-width="3"/>
  <rect x="42" y="43" width="32" height="22" rx="4" fill="#1F8F84"/>
  <rect x="42" y="51" width="32" height="3" fill="#BFEDE6"/>

  <text x="106" y="48" font-size="30" font-weight="700" fill="#7A3320">Experience</text>
  <text x="106" y="74" font-size="15" fill="#C86B4E">Click to open</text>

  <!-- twinkling sparkles -->
  <path class="tw"  transform="translate(560 32)" d="M0-8 L2.4-2.4 L8 0 L2.4 2.4 L0 8 L-2.4 2.4 L-8 0 L-2.4-2.4Z" fill="#F29C38"/>
  <path class="tw2" transform="translate(620 66)" d="M0-6 L1.8-1.8 L6 0 L1.8 1.8 L0 6 L-1.8 1.8 L-6 0 L-1.8-1.8Z" fill="#7ED6C9"/>
  <path class="tw3" transform="translate(675 30)" d="M0-5 L1.5-1.5 L5 0 L1.5 1.5 L0 5 L-1.5 1.5 L-5 0 L-1.5-1.5Z" fill="#E8A08A"/>

  <!-- bouncing chevron -->
  <g class="chev">
    <path d="M736 40 l14 14 l14 -14" fill="none" stroke="#C86B4E" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
