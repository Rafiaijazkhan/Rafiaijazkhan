<svg xmlns="http://www.w3.org/2000/svg" width="800" height="130" viewBox="0 0 800 130" role="img" aria-label="Software Intern at OneClout, Aug to Sep 2026" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
    .enter  { animation: enter 0.8s cubic-bezier(.2,.8,.2,1) both; }
    .enter2 { animation: enter 0.8s cubic-bezier(.2,.8,.2,1) 0.2s both; }
    .enter3 { animation: enter 0.8s cubic-bezier(.2,.8,.2,1) 0.4s both; }
    @keyframes enter { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: translateY(0); } }
    .tw { animation: tw 2.6s ease-in-out infinite; }
    @keyframes tw { 0%,100% { opacity: 0.25; } 50% { opacity: 1; } }
  </style>

  <g class="enter">
    <rect x="2" y="2" width="796" height="126" rx="24" fill="#FFF6E6" stroke="#7ED6C9" stroke-width="2.5"/>
    <rect x="2" y="26" width="10" height="78" rx="5" fill="#C86B4E"/>
  </g>

  <g class="enter2">
    <text x="52" y="62" font-size="30" font-weight="700" fill="#7A3320">Software Intern</text>
    <text x="52" y="98" font-size="23" font-weight="600" fill="#1F8F84">OneClout</text>
  </g>

  <g class="enter3">
    <rect x="580" y="44" width="180" height="42" rx="21" fill="#BFEDE6"/>
    <text x="670" y="72" font-size="18" font-weight="600" fill="#0F5E56" text-anchor="middle">Aug – Sep 2026</text>
    <path class="tw" transform="translate(556 34)" d="M0-7 L2-2 L7 0 L2 2 L0 7 L-2 2 L-7 0 L-2-2Z" fill="#F29C38"/>
    <path class="tw" transform="translate(778 104)" d="M0-5 L1.5-1.5 L5 0 L1.5 1.5 L0 5 L-1.5 1.5 L-5 0 L-1.5-1.5Z" fill="#E8A08A" style="animation-delay:1.2s"/>
  </g>
</svg>
