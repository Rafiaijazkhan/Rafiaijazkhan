<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 100" width="1200" height="200" role="img" aria-label="Thanks for stopping by - animated pastel footer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Thanks for stopping by</title>
  <defs>
    <path id="sp" d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z"/>
    <g id="fl">
      <ellipse cx="0" cy="-6" rx="3.5" ry="6"/>
      <ellipse cx="0" cy="-6" rx="3.5" ry="6" transform="rotate(72)"/>
      <ellipse cx="0" cy="-6" rx="3.5" ry="6" transform="rotate(144)"/>
      <ellipse cx="0" cy="-6" rx="3.5" ry="6" transform="rotate(216)"/>
      <ellipse cx="0" cy="-6" rx="3.5" ry="6" transform="rotate(288)"/>
      <circle r="3" fill="#FAC775"/>
    </g>
    <g id="bf">
      <g>
        <animateTransform attributeName="transform" type="scale" values="1 1;0.3 1;1 1" dur="0.6s" repeatCount="indefinite"/>
        <ellipse cx="-6" cy="-3" rx="6" ry="5"/>
        <ellipse cx="6" cy="-3" rx="6" ry="5"/>
        <ellipse cx="-4.5" cy="4" rx="4" ry="3.5"/>
        <ellipse cx="4.5" cy="4" rx="4" ry="3.5"/>
      </g>
      <ellipse cx="0" cy="0" rx="1.3" ry="5.5" fill="#4A1B0C" stroke="none"/>
    </g>
  </defs>

  <rect width="600" height="100" fill="#FAEEDA"/>
  <path d="M0 90 Q40 82 80 88 T160 86 T240 90 T320 84 T400 89 T480 85 T560 88 T600 86 V100 H0Z" fill="#9FE1CB"/>
  <path d="M0 96 Q60 91 120 95 T240 95 T360 94 T480 96 T600 94 V100 H0Z" fill="#5DCAA5"/>

  <g>
    <animateTransform attributeName="transform" type="rotate" values="-3 30 90;3 30 90;-3 30 90" dur="4s" repeatCount="indefinite"/>
    <path d="M30 90 Q35 78 30 64" stroke="#1D9E75" stroke-width="2" fill="none"/>
    <ellipse cx="37" cy="80" rx="7" ry="3" fill="#5DCAA5" transform="rotate(-30 37 80)"/>
    <use href="#fl" x="30" y="61" fill="#F4C0D1"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" values="3 85 90;-3 85 90;3 85 90" dur="5s" repeatCount="indefinite"/>
    <path d="M85 90 Q80 76 85 56" stroke="#1D9E75" stroke-width="2" fill="none"/>
    <ellipse cx="77" cy="74" rx="7" ry="3" fill="#9FE1CB" transform="rotate(30 77 74)"/>
    <use href="#fl" x="85" y="53" fill="#CECBF6"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-3 140 90;3 140 90;-3 140 90" dur="4.5s" begin="-1.5s" repeatCount="indefinite"/>
    <path d="M140 90 Q145 79 140 66" stroke="#1D9E75" stroke-width="2" fill="none"/>
    <ellipse cx="147" cy="82" rx="7" ry="3" fill="#5DCAA5" transform="rotate(-30 147 82)"/>
    <use href="#fl" x="140" y="63" fill="#F5C4B3"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" values="3 460 90;-3 460 90;3 460 90" dur="5.5s" begin="-2s" repeatCount="indefinite"/>
    <path d="M460 90 Q455 78 460 64" stroke="#1D9E75" stroke-width="2" fill="none"/>
    <ellipse cx="452" cy="80" rx="7" ry="3" fill="#9FE1CB" transform="rotate(30 452 80)"/>
    <use href="#fl" x="460" y="61" fill="#B5D4F4"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-3 515 90;3 515 90;-3 515 90" dur="4.2s" begin="-3s" repeatCount="indefinite"/>
    <path d="M515 90 Q520 76 515 56" stroke="#1D9E75" stroke-width="2" fill="none"/>
    <ellipse cx="522" cy="76" rx="7" ry="3" fill="#5DCAA5" transform="rotate(-30 522 76)"/>
    <use href="#fl" x="515" y="53" fill="#F4C0D1"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" values="3 570 90;-3 570 90;3 570 90" dur="5s" begin="-1s" repeatCount="indefinite"/>
    <path d="M570 90 Q565 79 570 64" stroke="#1D9E75" stroke-width="2" fill="none"/>
    <ellipse cx="562" cy="80" rx="7" ry="3" fill="#9FE1CB" transform="rotate(30 562 80)"/>
    <use href="#fl" x="570" y="61" fill="#CECBF6"/>
  </g>

  <circle cx="175" cy="88" r="4" fill="#FFFFFF" fill-opacity="0.6" stroke="#5DCAA5" stroke-width="1">
    <animateTransform attributeName="transform" type="translate" values="0 0;5 -40;-3 -80" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="240" cy="88" r="3" fill="#FFFFFF" fill-opacity="0.6" stroke="#ED93B1" stroke-width="1">
    <animateTransform attributeName="transform" type="translate" values="0 0;-5 -35;3 -78" dur="7s" begin="-3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="7s" begin="-3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="365" cy="88" r="5" fill="#FFFFFF" fill-opacity="0.6" stroke="#5DCAA5" stroke-width="1">
    <animateTransform attributeName="transform" type="translate" values="0 0;6 -42;-4 -82" dur="9s" begin="-5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="9s" begin="-5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="425" cy="88" r="3" fill="#FFFFFF" fill-opacity="0.6" stroke="#ED93B1" stroke-width="1">
    <animateTransform attributeName="transform" type="translate" values="0 0;-4 -38;4 -76" dur="7.5s" begin="-1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="7.5s" begin="-1s" repeatCount="indefinite"/>
  </circle>

  <g transform="translate(120 24)"><use href="#sp" fill="#EF9F27"><animateTransform attributeName="transform" type="scale" values="0.5;1;0.5" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/></use></g>
  <g transform="translate(235 20)"><use href="#sp" fill="#5DCAA5"><animateTransform attributeName="transform" type="scale" values="0.6;1;0.6" dur="3s" begin="-1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" begin="-1s" repeatCount="indefinite"/></use></g>
  <g transform="translate(365 22)"><use href="#sp" fill="#F0997B"><animateTransform attributeName="transform" type="scale" values="0.5;1;0.5" dur="2.8s" begin="-2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" begin="-2s" repeatCount="indefinite"/></use></g>
  <g transform="translate(480 26)"><use href="#sp" fill="#EF9F27"><animateTransform attributeName="transform" type="scale" values="0.6;1;0.6" dur="2.2s" begin="-0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" begin="-0.5s" repeatCount="indefinite"/></use></g>

  <g>
    <animateMotion path="M40 40 C120 10 200 70 300 30 S480 10 560 45 S300 80 40 40" dur="18s" repeatCount="indefinite"/>
    <use href="#bf" fill="#F4C0D1" stroke="#ED93B1" stroke-width="0.8"/>
  </g>
  <g>
    <animateMotion path="M560 30 C480 70 380 20 300 60 S120 20 40 60 S300 10 560 30" dur="22s" begin="-8s" repeatCount="indefinite"/>
    <use href="#bf" fill="#CECBF6" stroke="#AFA9EC" stroke-width="0.8"/>
  </g>

  <text x="300" y="54" text-anchor="middle" font-size="17" font-weight="500" fill="#712B13" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">thanks for stopping by</text>
</svg>
