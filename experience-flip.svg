<svg xmlns="http://www.w3.org/2000/svg" width="800" height="70" viewBox="0 0 800 70" role="img" aria-label="Experience: Software Intern at OneClout, Aug to Sep 2026" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }

    /* one 12s loop: Experience -> OneClout -> back */
    .a { animation: fadeA 12s ease-in-out infinite; }
    .b { animation: fadeB 12s ease-in-out infinite; opacity: 0; }
    .frame { animation: border 12s ease-in-out infinite; }

    @keyframes fadeA {
      0%, 36% { opacity: 1; transform: translateY(0); }
      42%     { opacity: 0; transform: translateY(-10px); }
      92%     { opacity: 0; transform: translateY(10px); }
      100%    { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeB {
      0%, 36% { opacity: 0; transform: translateY(10px); }
      44%, 86% { opacity: 1; transform: translateY(0); }
      92%, 100% { opacity: 0; transform: translateY(-10px); }
    }
    @keyframes border {
      0%, 36%  { stroke: #F5B461; }
      44%, 86% { stroke: #7ED6C9; }
      100%     { stroke: #F5B461; }
    }

    .spin { transform-origin: 42px 35px; animation: spin 14s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .tw  { animation: tw 2.4s ease-in-out infinite; }
    .tw2 { animation: tw 2.4s ease-in-out 0.8s infinite; }
    .tw3 { animation: tw 2.4s ease-in-out 1.6s infinite; }
    @keyframes tw { 0%,100% { opacity: 0.2; } 50% { opacity: 1; } }
  </style>

  <rect class="frame" x="2" y="2" width="796" height="66" rx="20" fill="#FFF6E6" stroke="#F5B461" stroke-width="2.5"/>

  <!-- flower icon (stays while the text changes) -->
  <circle cx="42" cy="35" r="21" fill="#BFEDE6"/>
  <g class="spin">
    <g transform="translate(42 35)">
      <ellipse cx="0" cy="-7" rx="4.6" ry="6.6" fill="#F4A9C0"/>
      <ellipse cx="0" cy="-7" rx="4.6" ry="6.6" fill="#F4A9C0" transform="rotate(72)"/>
      <ellipse cx="0" cy="-7" rx="4.6" ry="6.6" fill="#E9B8E8" transform="rotate(144)"/>
      <ellipse cx="0" cy="-7" rx="4.6" ry="6.6" fill="#F4A9C0" transform="rotate(216)"/>
      <ellipse cx="0" cy="-7" rx="4.6" ry="6.6" fill="#E9B8E8" transform="rotate(288)"/>
      <circle r="4.6" fill="#F5B461"/>
      <circle r="1.8" fill="#FFF6E6"/>
    </g>
  </g>

  <!-- state 1: Experience -->
  <g class="a">
    <text x="82" y="35" font-size="24" font-weight="700" fill="#7A3320">Experience</text>
    <text x="82" y="54" font-size="13" fill="#C86B4E">Where I have worked</text>
  </g>

  <!-- state 2: OneClout -->
  <g class="b">
    <text x="82" y="35" font-size="24" font-weight="700" fill="#7A3320">Software Intern</text>
    <text x="82" y="54" font-size="15" font-weight="600" fill="#1F8F84">OneClout</text>
    <rect x="596" y="19" width="164" height="32" rx="16" fill="#BFEDE6"/>
    <text x="678" y="41" font-size="15" font-weight="600" fill="#0F5E56" text-anchor="middle">Aug – Sep 2026</text>
  </g>

  <!-- twinkling sparkles -->
  <path class="tw"  transform="translate(500 22)" d="M0-7 L2-2 L7 0 L2 2 L0 7 L-2 2 L-7 0 L-2-2Z" fill="#F29C38"/>
  <path class="tw2" transform="translate(556 50)" d="M0-5 L1.5-1.5 L5 0 L1.5 1.5 L0 5 L-1.5 1.5 L-5 0 L-1.5-1.5Z" fill="#7ED6C9"/>
  <path class="tw3" transform="translate(782 22)" d="M0-4 L1.2-1.2 L4 0 L1.2 1.2 L0 4 L-1.2 1.2 L-4 0 L-1.2-1.2Z" fill="#E8A08A"/>
</svg>
